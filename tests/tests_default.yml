---
- name: Ensure that the role runs with default parameters
  hosts: all
  vars:
    trustee_client_trustee_gc: true
    trustee_client_encrypt_disk: false
  tasks:
    - name: See if /dev/log exists for the fingerprint check
      ansible.builtin.stat:
        path: /dev/log
      register: __register_dev_log

    - name: Set the start time for the journal search
      ansible.builtin.set_fact:
        __journal_start_time: "{{ ansible_facts['date_time']['date'] ~ ' ' ~ ansible_facts['date_time']['time'] }}"
      when: __register_dev_log.stat.exists

    - name: Run the tests
      block:
        - name: Run the role
          ansible.builtin.include_tasks:
            file: tasks/run_role_with_clear_facts.yml
          vars:
            __trustee_client_write_log_file: true
            __sr_public: true

        - name: Get fingerprint entries from journal
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: >-
              set -eo pipefail;
              journalctl --since "{{ __journal_start_time }}" --no-pager |
              grep -v " Invoked with" |
              grep "sr_fingerprint.*role_name=trustee_client"
          register: __register_journal_fingerprints
          changed_when: false
          when: __register_dev_log.stat.exists

        - name: Check that the log file was written
          ansible.builtin.slurp:
            path: /var/log/sysroles.jsonl
          register: __register_log_file

        - name: Verify log file and journal fingerprints
          when: __register_dev_log.stat.exists
          vars:
            __journal_lines: "{{ __register_journal_fingerprints.stdout_lines }}"
            __journal_begin: "{{ __journal_lines | select('search', 'status=begin') | list }}"
            __journal_success: "{{ __journal_lines | select('search', 'status=success') | list }}"
            __begin_date: "{{ (__journal_begin[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
            __success_date: "{{ (__journal_success[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
            __file_content: "{{ __register_log_file.content | b64decode }}"
          block:
            - name: Print contents of logs
              debug:
                var: item
              loop:
                - "{{ __file_content }}"
                - "{{ __journal_lines }}"

            - name: Assert content is correct
              ansible.builtin.assert:
                that:
                  - __journal_begin | length > 0
                  - __journal_success | length > 0
                  - __begin_date in __file_content
                  - __success_date in __file_content

        - name: Flush handlers to start services created by the role
          ansible.builtin.meta: flush_handlers

        - name: Collect package facts
          package_facts:
            manager: auto
          no_log: true

        - name: Assert required packages are installed
          assert:
            that:
              - item in ansible_facts.packages
            fail_msg: "Required package '{{ item }}' is not installed"
          loop: "{{ __trustee_client_trustee_gc_packages }}"

        - name: Stat the quadlet install directory
          stat:
            path: "{{ __trustee_client_quadlet_install_dir }}"
          register: __test_quadlet_dir

        - name: Assert quadlet install directory exists
          assert:
            that:
              - __test_quadlet_dir.stat.exists
              - __test_quadlet_dir.stat.isdir
            fail_msg: >-
              Quadlet install directory {{ __trustee_client_quadlet_install_dir }}
              does not exist

        - name: Find deployed quadlet files
          find:
            paths: "{{ __trustee_client_quadlet_install_dir }}"
            patterns:
              - "*.container"
              - "*.volume"
              - "*.network"
              - "*.kube"
              - "*.pod"
          register: __test_quadlet_files

        - name: Assert quadlet files were deployed
          assert:
            that:
              - __test_quadlet_files.files | length > 0
            fail_msg: >-
              No quadlet files found in {{ __trustee_client_quadlet_install_dir }}

        - name: Stat the trustee-gc config directory
          stat:
            path: /etc/trustee-gc
          register: __test_trustee_gc_dir

        - name: Assert trustee-gc config directory exists
          assert:
            that:
              - __test_trustee_gc_dir.stat.exists
              - __test_trustee_gc_dir.stat.isdir
            fail_msg: "Trustee GC config directory /etc/trustee-gc does not exist"

        - name: Find trustee pod file
          find:
            paths: "{{ __trustee_client_quadlet_install_dir }}"
            patterns: "*.pod"
            recurse: false
          register: __test_trustee_pod_files

        - name: Assert trustee pod file exists
          assert:
            that: __test_trustee_pod_files.matched | int > 0
            fail_msg: "No trustee pod file found in {{ __trustee_client_quadlet_install_dir }}"

        - name: Set trustee pod service name
          ansible.builtin.set_fact:
            __test_trustee_pod_service: "{{ (__test_trustee_pod_files.files[0].path | basename) | replace('.pod', '') }}-pod"

        - name: Assert trustee pod service is running
          ansible.builtin.service:
            name: "{{ __test_trustee_pod_service }}"
            state: started
          check_mode: true

        - name: Run the role again to check idempotency
          ansible.builtin.include_tasks:
            file: tasks/run_role_with_clear_facts.yml
          vars:
            __sr_public: true

        # Not where /dev/sev-guest exists: the role still restarts the pod there
        - name: Assert the second run did not restart the pod
          ansible.builtin.assert:
            that:
              - __trustee_client_pod_service is not changed
              - __trustee_client_pod_service.status.ActiveState == 'active'
            fail_msg: >-
              The second run of the role changed the Trustee Guest
              Components files, or had to start or restart the pod
          when: not __sev_guest_device.stat.exists
      always:
        - name: Cleanup trustee_client test resources
          ansible.builtin.include_tasks:
            file: tasks/cleanup.yml
          tags:
            - tests::cleanup
