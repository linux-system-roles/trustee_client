---
# Verify meta/argument_specs.yml and tasks/assert_role_vars.yml reject bad
# parameters. Each block runs the role expecting failure; rescue records
# that outcome.
- name: Verify invalid parameters are rejected
  hosts: all
  vars:
    __invalid_input_failure_messages: >-
      {{ ([ansible_failed_result.msg | default('') | string,
           ansible_failed_result.msg.msg | default('') | string]
          + (ansible_failed_result.results | default([])
             | map(attribute='msg') | map('default', '') | list))
         | join(' ') }}
  tasks:
    - name: Run invalid input tests
      block:
        # ====================================================
        # Section 1: Verify role works with valid defaults
        # ====================================================
        - name: Run role with valid defaults
          ansible.builtin.include_tasks:
            file: tasks/run_role_with_clear_facts.yml

        # ====================================================
        # Section 2: argument_specs validation (Ansible 2.11+)
        # ====================================================
        - name: Run argument specs validation tests
          when: ansible_version.full is version('2.11', '>=')
          block:
            # --- Test: non-boolean trustee_client_trustee_gc ---
            - name: Argument specs reject non-boolean trustee_client_trustee_gc
              block:
                - name: Run role with non-boolean trustee_client_trustee_gc
                  ansible.builtin.include_tasks:
                    file: tasks/run_role_with_clear_facts.yml
                  vars:
                    trustee_client_trustee_gc: not_a_bool
              rescue:
                - name: Mark invalid trustee_client_trustee_gc type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_trustee_gc_type_failed: true
                  when: >-
                    "argument 'trustee_client_trustee_gc'" in
                    __invalid_input_failure_messages and
                    'convert to bool' in __invalid_input_failure_messages

            - name: Assert invalid trustee_client_trustee_gc type was rejected
              ansible.builtin.assert:
                that:
                  - __invalid_input_trustee_gc_type_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject
                  trustee_client_trustee_gc values that are not
                  booleans

            # --- Test: non-boolean secret_registration_enabled ---
            - name: Argument specs reject non-boolean secret_registration_enabled
              block:
                - name: Run role with non-boolean secret_registration_enabled
                  ansible.builtin.include_tasks:
                    file: tasks/run_role_with_clear_facts.yml
                  vars:
                    trustee_client_secret_registration_enabled: not_a_bool
              rescue:
                - name: Mark invalid secret_registration_enabled type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_secret_reg_enabled_type_failed: true
                  when: >-
                    "argument 'trustee_client_secret_registration_enabled'"
                    in __invalid_input_failure_messages and
                    'convert to bool' in __invalid_input_failure_messages

            - name: Assert invalid secret_registration_enabled type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_secret_reg_enabled_type_failed
                    | default(false)
                fail_msg: >-
                  meta/argument_specs should reject
                  trustee_client_secret_registration_enabled values
                  that are not booleans

            # --- Test: non-boolean trustee_client_encrypt_disk ---
            - name: Argument specs reject non-boolean trustee_client_encrypt_disk
              block:
                - name: Run role with non-boolean trustee_client_encrypt_disk
                  ansible.builtin.include_tasks:
                    file: tasks/run_role_with_clear_facts.yml
                  vars:
                    trustee_client_encrypt_disk: not_a_bool
              rescue:
                - name: Mark invalid trustee_client_encrypt_disk type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_encrypt_disk_type_failed: true
                  when: >-
                    "argument 'trustee_client_encrypt_disk'" in
                    __invalid_input_failure_messages and
                    'convert to bool' in __invalid_input_failure_messages

            - name: Assert invalid trustee_client_encrypt_disk type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_encrypt_disk_type_failed
                    | default(false)
                fail_msg: >-
                  meta/argument_specs should reject
                  trustee_client_encrypt_disk values that are not
                  booleans

            # --- Test: non-boolean trustee_client_secure_logging ---
            - name: Argument specs reject non-boolean secure_logging
              block:
                - name: Run role with non-boolean secure_logging
                  ansible.builtin.include_tasks:
                    file: tasks/run_role_with_clear_facts.yml
                  vars:
                    trustee_client_secure_logging: not_a_bool
              rescue:
                - name: Mark invalid secure_logging type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_secure_logging_type_failed: true
                  when: >-
                    "argument 'trustee_client_secure_logging'" in
                    __invalid_input_failure_messages and
                    'convert to bool' in __invalid_input_failure_messages

            - name: Assert invalid secure_logging type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_secure_logging_type_failed
                    | default(false)
                fail_msg: >-
                  meta/argument_specs should reject
                  trustee_client_secure_logging values that are not
                  booleans

        # ====================================================
        # Section 3: assert_role_vars validation (all versions)
        # ====================================================

        # --- Test: role-level string validation for trustee_client_kbs_url ---
        - name: Role-level string validation rejects non-string kbs_url
          block:
            - name: Run role with non-string trustee_client_kbs_url
              ansible.builtin.include_tasks:
                file: tasks/run_role_with_clear_facts.yml
              vars:
                trustee_client_kbs_url: 123
          rescue:
            - name: Mark invalid trustee_client_kbs_url type rejected
              ansible.builtin.set_fact:
                __invalid_input_kbs_url_type_failed: true
              when: >-
                'trustee_client_kbs_url must be a string, got int'
                in __invalid_input_failure_messages

        - name: Assert role-level kbs_url string validation was enforced
          ansible.builtin.assert:
            that:
              - __invalid_input_kbs_url_type_failed | default(false)
            fail_msg: >-
              tasks/assert_role_vars.yml should reject
              trustee_client_kbs_url values that are not strings

        # --- Test: role-level string validation for kbs_cert_content ---
        - name: Role-level string validation rejects non-string kbs_cert_content
          block:
            - name: Run role with non-string kbs_cert_content
              ansible.builtin.include_tasks:
                file: tasks/run_role_with_clear_facts.yml
              vars:
                trustee_client_kbs_cert_content: 123
          rescue:
            - name: Mark invalid kbs_cert_content type rejected
              ansible.builtin.set_fact:
                __invalid_input_kbs_cert_content_type_failed: true
              when: >-
                'trustee_client_kbs_cert_content must be a string, got int'
                in __invalid_input_failure_messages

        - name: Assert role-level kbs_cert_content string validation was enforced
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_kbs_cert_content_type_failed
                | default(false)
            fail_msg: >-
              tasks/assert_role_vars.yml should reject
              trustee_client_kbs_cert_content values that are not
              strings

        # --- Test: role-level string validation for kbs_cert_src ---
        - name: Role-level string validation rejects non-string kbs_cert_src
          block:
            - name: Run role with non-string kbs_cert_src
              ansible.builtin.include_tasks:
                file: tasks/run_role_with_clear_facts.yml
              vars:
                trustee_client_kbs_cert_src: 123
          rescue:
            - name: Mark invalid kbs_cert_src type rejected
              ansible.builtin.set_fact:
                __invalid_input_kbs_cert_src_type_failed: true
              when: >-
                'trustee_client_kbs_cert_src must be a string, got int'
                in __invalid_input_failure_messages

        - name: Assert role-level kbs_cert_src string validation was enforced
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_kbs_cert_src_type_failed
                | default(false)
            fail_msg: >-
              tasks/assert_role_vars.yml should reject
              trustee_client_kbs_cert_src values that are not strings

        # --- Test: secret_registration_enabled requires trustee_gc ---
        - name: Assert rejects secret_registration_enabled without trustee_gc
          block:
            - name: Run role with secret_registration_enabled and trustee_gc false
              ansible.builtin.include_tasks:
                file: tasks/run_role_with_clear_facts.yml
              vars:
                trustee_client_trustee_gc: false
                trustee_client_secret_registration_enabled: true
          rescue:
            - name: Mark secret_registration without trustee_gc rejected
              ansible.builtin.set_fact:
                __invalid_input_secret_reg_requires_trustee_gc_failed: true
              when: >-
                'trustee_client_secret_registration_enabled requires'
                in __invalid_input_failure_messages and
                'trustee_client_trustee_gc to be true'
                in __invalid_input_failure_messages

        - name: Assert secret_registration without trustee_gc was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_secret_reg_requires_trustee_gc_failed
                | default(false)
            fail_msg: >-
              tasks/assert_role_vars.yml should reject
              trustee_client_secret_registration_enabled when
              trustee_client_trustee_gc is false

      always:
        - name: Clear test facts
          ansible.builtin.set_fact:
            __invalid_input_trustee_gc_type_failed:
            __invalid_input_kbs_url_type_failed:
            __invalid_input_kbs_cert_content_type_failed:
            __invalid_input_kbs_cert_src_type_failed:
            __invalid_input_secret_reg_enabled_type_failed:
            __invalid_input_encrypt_disk_type_failed:
            __invalid_input_secure_logging_type_failed:
            __invalid_input_secret_reg_requires_trustee_gc_failed:
          tags: tests::cleanup
